# GitHub Pages runs this site through Jekyll, which copies every file as it is (no page here has front matter).
# These folders stay in the repository but are not published on mapelago.com.
# tests/run.js checks this list, that .nojekyll stays deleted, and that nothing published needs Jekyll to change it.
exclude:
  - review
  - tests
  - copy
  - data
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor
